<style>

  :root { --fondo: #08090d; --txt: #e8edf3; --mut: #93a1b5; --acento: #5eead4; --linea: #ffffff29; --punto: #cbd5e138; color-scheme: dark; }
  @media (prefers-color-scheme: light) { :root { --fondo: #f5f4f0; --txt: #0d131c; --mut: #4b5563; --acento: #0d9488; --linea: #0b111a2e; --punto: #0d131c24; color-scheme: light; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 24px; background: var(--fondo); color: var(--txt);
    font: 400 17px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  /* La materia, quieta: una rejilla de partículas que se desvanece hacia los bordes, con dos luces detrás. */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1;
    background: radial-gradient(60vw 50vh at 85% 8%, color-mix(in srgb, var(--acento) 14%, transparent), transparent 70%),
                radial-gradient(50vw 50vh at 0% 80%, color-mix(in srgb, #38bdf8 9%, transparent), transparent 70%); }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle, var(--punto) 1.1px, transparent 1.6px) 0 0 / 22px 22px;
    mask-image: radial-gradient(ellipse at 50% 45%, #000 0%, transparent 72%); animation: deriva 18s linear infinite; }
  @keyframes deriva { to { background-position: 22px 22px; } }
  main { width: min(560px, 100%); }
  .marca { width: 76px; height: 76px; display: block; margin-bottom: 34px; filter: drop-shadow(0 18px 40px #0009); }
  h1 { margin: 0; font-size: clamp(54px, 15vw, 96px); font-weight: 800; letter-spacing: -.06em; line-height: .9; }
  h1 i { color: var(--acento); font-style: normal; }
  p { margin: 22px 0 0; max-width: 34ch; color: var(--mut); font-size: 18px; }
  .acciones { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 26px; margin-top: 34px; }
  .boton { display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border-radius: 14px; background: var(--acento); color: #06231f;
    font-weight: 650; text-decoration: none; }
  .boton:focus-visible, .enlace:focus-visible { outline: 2px solid var(--acento); outline-offset: 4px; }
  .enlace { color: var(--txt); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--linea); padding-bottom: 2px; }
  .nota { margin-top: 40px; font-size: 14px; }
  @media (prefers-reduced-motion: reduce) { body::after { animation: none; } }
</style>

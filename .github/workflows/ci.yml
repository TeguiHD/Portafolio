name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v6
    
    - name: Install pnpm
      uses: pnpm/action-setup@v5
      with:
        version: 10.33.0

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}
        check-latest: true
        cache: pnpm
        cache-dependency-path: APP/NEXT_APP/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: ./APP/NEXT_APP
      run: pnpm install --frozen-lockfile

    # ============================================
    # Security Audit
    # ============================================
    - name: Security Audit
      working-directory: ./APP/NEXT_APP
      run: pnpm audit --prod --audit-level=high

    - name: Generate Prisma Client
      working-directory: ./APP/NEXT_APP
      env:
        DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
      run: pnpm exec prisma generate

    # ============================================
    # Code Quality Checks
    # ============================================
    - name: Lint
      working-directory: ./APP/NEXT_APP
      run: pnpm run lint

    - name: Type Check
      working-directory: ./APP/NEXT_APP
      run: pnpm run typecheck

    - name: SEO Audit
      working-directory: ./APP/NEXT_APP
      run: pnpm run seo:audit

    # ============================================
    # Build Verification
    # ============================================
    - name: Build
      working-directory: ./APP/NEXT_APP
      run: pnpm run build
      env:
        DATABASE_URL: "postgresql://user:pass@localhost:5432/db"
        NEXTAUTH_SECRET: "ci-build-secret-key-minimum-32-chars"
        NEXTAUTH_URL: "http://localhost:3000"
        ENCRYPTION_KEY: "ci-encryption-key-exactly-32-ch"
        REDIS_URL: "redis://localhost:6379"
